[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rir-api"
version = "0.1.0"
description = "API REST para procesamiento y analisis de respuestas al impulso segun ISO 3382"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Estudiante", email = "estudiante@example.com" },
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "marimo",
    "numpy",
    "scipy",
    "matplotlib",
    "soundfile",
    "sounddevice",
    "python-multipart",
]

[project.scripts]
start-marimo = "app.marimo_launcher:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "B008", # FastAPI usa llamadas (File(...), Query(...), Depends(...)) como defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N806"] # nombres tipo W_inf/Sxx habituales en notacion de senales

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
